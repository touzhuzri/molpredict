[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molpredict"
version = "0.1.0"
description = "轻量级分子性质预测工具（第一阶段：杀菌活性可能性）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "catboost>=1.2",
]

[project.optional-dependencies]
# ConfSeq 官方表示学习 / embedding（CPU 即可）
confseq = [
    "torch>=2.0",
    "transformers>=4.50",
    "tqdm",
    "epam.indigo>=1.32",
    "SmilesPE>=0.0.3",
    "timeout_decorator>=0.5",
]
# V2 额外需要 PaDEL；需与 confseq extra 一起安装（pip install -e ".[confseq,v2]"）
v2 = ["padelpy>=0.1.17", "pandas>=2.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
molpredict = "molpredict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
